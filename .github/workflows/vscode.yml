name: VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/vscode.yml"

# Publishing lives in release.yml (job: publish-extension). A `release:` trigger
# would never fire here: release.yml creates the release with GITHUB_TOKEN, and
# GITHUB_TOKEN-triggered events cannot start new workflow runs.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tar` is the only dependency that ships in the VSIX, so a known
      # advisory here reaches users rather than just the build.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck & bundle
        run: npm run build

      # `npm run build` already ran tsc, so this only executes the compiled
      # tests. Until now no TypeScript ran in CI at all — including the
      # ProcessExecution path that resolves every run command.
      - name: Test
        run: node --test $(find out -name '*.test.js')

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-runner-vscode
          path: extensions/vscode/*.vsix
